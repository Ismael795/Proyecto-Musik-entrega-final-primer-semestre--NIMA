<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Contacto de MUSIK, revista digital de música."
    />
    <title>Contacto | MUSIK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark musik-navbar">
        <div class="container">
          <a class="navbar-brand musik-logo" href="index.html"
            >MUS<span>IK</span></a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal"
            aria-expanded="false"
            aria-label="Abrir navegación"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav ms-auto align-items-lg-center">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="index.html#tango">Tango</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="index.html#salsa">Salsa</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="contacto.html">Contacto</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container contact-container">
      <div class="section-heading">
        <p class="eyebrow">ESCRÍBENOS</p>
        <h1 class="contact-title">Contacto</h1>
        <p class="muted-copy">
          ¿Tenés una consulta o una sugerencia para MUSIK? Dejanos tu mensaje.
        </p>
      </div>

      <div class="contact-card">
        <div id="alerta" role="alert"></div>

        <form id="form-contacto" novalidate>
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input
              type="text"
              class="form-control"
              id="nombre"
              name="nombre"
              required
            />
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="tu@email.com"
              required
            />
          </div>

          <div class="mb-3">
            <label for="asunto" class="form-label">Asunto</label>
            <input type="text" class="form-control" id="asunto" name="asunto" />
          </div>

          <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje</label>
            <textarea
              class="form-control"
              id="mensaje"
              name="mensaje"
              rows="5"
              placeholder="Escribí tu mensaje acá..."
              required
            ></textarea>
          </div>

          <button type="submit" class="btn btn-musik">Enviar mensaje</button>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <div
        class="container d-flex flex-column flex-sm-row justify-content-between gap-2"
      >
        <a class="footer-logo" href="index.html">MUSIK</a>
        <p class="mb-0">Revista digital de música · Primera entrega</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/contacto.js"></script>
  </body>
</html>
